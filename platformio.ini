; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
; Serial upload/monitor settings
; upload_port/monitor_port intentionally omitted so PlatformIO auto-detects the port -
; esptool v5.1.0 treats the literal string "auto" as a real port name and fails immediately
; ("Could not open auto, the port is busy or doesn't exist"); it does NOT mean "auto-detect".
; If auto-detect ever fails, set the real port explicitly, e.g. upload_port = COM3.
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Native (PC-side) unit test env for Arduino-free pure logic only (see src/sensor_logic.cpp).
; Excludes every .cpp that pulls in Arduino/ETH/WiFi/WebServer/Preferences headers, since
; those can't link on a desktop toolchain.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<*>
    -<cantim_mqtt_new.cpp>
    -<html.cpp>
    -<mqtt.cpp>
    -<web.cpp>