; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; KHONG co lib_extra_dirs/lib_deps: project nay khong dung thu vien ngoai nao ca - moi
; #include trong src/ va include/ deu la core Arduino-ESP32 hoac ESP-IDF (ETH.h, WebServer.h,
; Preferences.h, Update.h, mqtt_client.h, HardwareSerial.h...). Cam bien VL53L1X nam o node
; ngoai, noi chuyen qua RS485 chu khong phai lib local. Truoc day co
;   lib_extra_dirs = ~/Documents/Arduino/libraries
; nhung khong keo gi vao ca - chi lam nguoi doc tuong build phu thuoc thu muc ca nhan do.
; Serial upload/monitor settings
; upload_port/monitor_port intentionally omitted so PlatformIO auto-detects the port -
; esptool v5.1.0 treats the literal string "auto" as a real port name and fails immediately
; ("Could not open auto, the port is busy or doesn't exist"); it does NOT mean "auto-detect".
; If auto-detect ever fails, set the real port explicitly, e.g. upload_port = COM3.
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Da bo [env:native] va toan bo thu muc test/ - project nay khong dung unit test nua.
;
; (Env do chay 10 unit test Unity tren PC cho src/sensor_logic.cpp. No da build fail san tu
; commit fbf96c4: build_src_filter la danh sach DEN (+<*> roi tru 4 file), nen relay.cpp -
; them sau va co #include <Arduino.h> - bi keo vao build native va lam chet ca lan chay test
; truoc khi co test nao kip chay.)
;
; LUU Y: src/sensor_logic.cpp va include/sensor_logic.h VAN duoc firmware dung - readRS485()
; goi parseSensorLine() de boc dong RS485 "id,distance" tu node cam bien. KHONG xoa 2 file do.
; Rieng viec parseSensorLine() phai TU CHOI truong so rac ("1,ERR", "1,") la co chu dich: neu
; nhan bua thanh distance=0 thi lastRS485[] van duoc refresh, sensor hong se trong nhu dang
; ONLINE binh thuong ma khong bao gio vao khoang hop le - khong co canh bao OFFLINE nao het.